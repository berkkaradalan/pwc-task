# Override for the end-to-end check (scripts/e2e.sh), used together with docker-compose.yml.
# Its own project name and no published ports keep it apart from a running local stack.
name: oncall-rag-e2e

services:
  db:
    ports: !reset []

  # CI has no API key: always local, whatever RUN_MODE says in .env.
  # scripts/e2e.sh also turns on the `local` profile for the Ollama services.
  ingest:
    environment:
      RUN_MODE: local

  ollama:
    ports: !reset []
    volumes:
      # Model files live in a host folder so CI can cache them between runs.
      - ${OLLAMA_MODELS_DIR:?set OLLAMA_MODELS_DIR to a host folder for Ollama models}:/root/.ollama/models

  api:
    environment:
      RUN_MODE: local
    ports: !reset []
