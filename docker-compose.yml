services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?set POSTGRES_HOST_PORT in .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.5
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:?set OLLAMA_HOST_PORT in .env}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.40.5
    # Pull only when the model is missing, so a restart works offline.
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama show "$$EMBEDDING_MODEL" > /dev/null || ollama pull "$$EMBEDDING_MODEL"']
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL in .env}
    depends_on:
      ollama:
        condition: service_healthy

  ingest:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMBEDDING_BASE_URL: http://ollama:11434
      DOCS_DIR: data/docs
    volumes:
      - ./data/docs:/app/data/docs:ro
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  ollama:
