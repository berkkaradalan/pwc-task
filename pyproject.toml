[project]
name = "oncall-rag"
version = "0.1.0"
description = "Retrieval-augmented assistant for on-call runbooks"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Request ID per API request (X-Request-ID) and a logging filter that adds it to log lines.
    "asgi-correlation-id>=5.0.1",
    # HTTP API of the question-answering service.
    "fastapi>=0.162.0",
    # Markdown header and size-based text splitting.
    "langchain-text-splitters>=1.1.3",
    # Retrieve -> generate | no_context flow of the question-answering service.
    "langgraph>=1.2.20",
    # OpenAI-compatible client: chat for OpenRouter and Ollama, embeddings for Ollama.
    "openai>=3.46.0",
    # pgvector type adapters for psycopg.
    "pgvector>=0.4",
    # Async PostgreSQL driver; the binary extra bundles libpq so no system library is needed.
    "psycopg[binary]>=3.2",
    # Connection pool for concurrent API requests.
    "psycopg-pool>=3.3.3",
    # Settings models (imported directly, so declared explicitly).
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # YAML front matter parsing.
    "python-frontmatter>=1.3.0",
    # yaml.YAMLError is caught directly when front matter is malformed.
    "pyyaml>=6.0",
    # ASGI server that runs the API.
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    # Transport of the openai SDK; its MockTransport fakes the model APIs in tests.
    "httpx2>=2.16.0",
    # Static type checking (strict) for src/.
    "mypy>=2.4.1",
    # Runs the same lint and secret checks locally before each commit.
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    # Runs the async pipeline and adapter tests.
    "pytest-asyncio>=0.24",
    # Coverage report for the test run.
    "pytest-cov>=7.1.0",
    # Linter and formatter.
    "ruff>=0.17.3",
    # Type stubs for PyYAML, used by the strict mypy check.
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: needs real services (PostgreSQL, Ollama); excluded by default",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
# Deliberately malformed test inputs; formatting them would change what the tests read.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
# Tests are checked too; they have no __init__.py, so modules are named after their path from
# the root, and src/ maps to the oncall_rag package.
mypy_path = "src"
explicit_package_bases = true
