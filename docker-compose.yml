services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?set POSTGRES_HOST_PORT in .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.5
    environment:
      # One request at a time and a fixed context keep memory predictable on CPU-only machines.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:?set OLLAMA_HOST_PORT in .env}:11434"
    deploy:
      resources:
        limits:
          # Both models loaded need ~4.4 GB; past the limit only this container is killed.
          memory: ${OLLAMA_MEMORY_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.40.5
    # Pull only the models that are missing, so a restart works offline.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for model in $$OLLAMA_PULL_MODELS; do
        ollama show "$$model" > /dev/null || ollama pull "$$model" || exit 1;
        done
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:?set OLLAMA_PULL_MODELS in .env}
    depends_on:
      ollama:
        condition: service_healthy

  ingest:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMBEDDING_BASE_URL: http://ollama:11434
      DOCS_DIR: data/docs
    volumes:
      - ./data/docs:/app/data/docs:ro
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  api:
    build: .
    # The API writes its own access log line, with the request ID and duration.
    command:
      - uvicorn
      - oncall_rag.query.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMBEDDING_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      # The image has no curl; urlopen raises (exit code 1) on connection errors and on 503.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    depends_on:
      ingest:
        condition: service_completed_successfully

volumes:
  pgdata:
  ollama: